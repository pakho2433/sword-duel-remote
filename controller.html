<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>劍俠遙控器</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#fff;background:#1e1b3a}
body.p1{background:radial-gradient(circle at 50% 20%,#4f8ff7,#1d3f8f)}body.p2{background:radial-gradient(circle at 50% 20%,#f76b6b,#8f1d1d)}
body.good{animation:flashG .5s}body.bad{animation:flashR .5s}
@keyframes flashG{0%{box-shadow:inset 0 0 0 40px #22c55e}100%{box-shadow:inset 0 0 0 0 #22c55e}}
@keyframes flashR{0%{box-shadow:inset 0 0 0 40px #fff}100%{box-shadow:inset 0 0 0 0 #fff}}
#top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;font-size:26px;font-weight:bold}
#conn{font-size:22px}
#role{text-align:center;font-size:90px;margin-top:4px;line-height:1.1}
#roleTxt{text-align:center;font-size:30px;font-weight:900;min-height:40px}
#incoming{text-align:center;font-size:30px;min-height:44px}
#score{text-align:center;font-size:24px;opacity:.9}
#pad{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:44vh}
#pad button{font-size:64px;border-radius:26px;border:5px solid #fff;background:#ffffff2a;color:#fff;box-shadow:0 8px 0 #0005}
#pad button:active,#pad button.hit{transform:translateY(6px);box-shadow:0 2px 0 #0005;background:#ffd54a88}
#bT{grid-column:1/3}
#motion{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(44vh + 30px);font-size:22px;padding:10px 22px;border-radius:30px;border:3px solid #fff;background:#0004;color:#fff}
#motion.on{background:#22c55e88}
#overlay{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;gap:16px;text-align:center;z-index:9}
#overlay input{font-size:40px;width:6em;text-align:center;letter-spacing:8px;border-radius:14px;border:0;padding:8px;text-transform:uppercase}
#overlay button,#startBtn{font-size:30px;padding:12px 36px;border-radius:18px;border:0;background:#ffd54a;color:#4a2b00;font-weight:bold}
#startBtn{position:absolute;left:50%;top:36%;z-index:3;transform:translateX(-50%)}
.hidden{display:none!important}
#swingFx{position:fixed;inset:0;pointer-events:none;font-size:160px;display:flex;align-items:center;justify-content:center;opacity:0}
#swingFx.show{animation:sw .45s}
@keyframes sw{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.4)}}
</style>
</head>
<body>
<div id="top"><span id="me">1P</span><span id="conn">⏳</span></div>
<div id="role">⏳</div>
<div id="roleTxt"></div>
<div id="incoming"></div>
<div id="score"></div>
<button id="startBtn" class="hidden">▶ 開始</button>
<button id="motion">📳 揮動手機</button>
<div id="pad">
  <button id="bT" data-d="T">⬆️</button>
  <button id="bL" data-d="L">⬅️</button>
  <button id="bR" data-d="R">➡️</button>
</div>
<div id="swingFx"></div>
<div id="overlay" class="hidden">
  <div>⚔️ 房間</div>
  <input id="codeIn" maxlength="4" autocomplete="off">
  <div><button id="p1b">1P 🛡️</button> <button id="p2b">2P 🪓</button></div>
</div>
<script src="js/controller.js"></script>
</body>
</html>
